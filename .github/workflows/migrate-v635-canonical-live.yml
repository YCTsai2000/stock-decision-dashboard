name: Apply V6.3.5 canonical live migration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/migrate-v635-canonical-live.mjs'
      - '.github/workflows/migrate-v635-canonical-live.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply migration
        run: node scripts/migrate-v635-canonical-live.mjs
      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "No migration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/intraday.ts src/intradayCore.ts src/ModeShell.tsx
          git commit -m "feat: align V6.3.5 live intraday data with canonical replay"
          git push origin HEAD:main
