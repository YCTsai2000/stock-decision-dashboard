name: Event reversal optimizer V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/optimize-event-reversal-v2.mjs'
      - '.github/workflows/optimize-event-reversal-v2.yml'

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run V2 cross-sectional optimizer
        run: node scripts/optimize-event-reversal-v2.mjs

      - name: Upload V2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-reversal-optimizer-v2
          path: backtest-output-event-reversal-v2/
          if-no-files-found: warn
          retention-days: 30
