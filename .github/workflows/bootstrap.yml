name: Bootstrap project source

on:
  push:
    branches: [chatgpt-deploy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-deploy

      - name: Reassemble and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/p2_0 .bootstrap/p2_1 .bootstrap/part03 .bootstrap/part04 .bootstrap/part05 > /tmp/project.tar.gz.b64
          base64 --decode /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          tar -tzf /tmp/project.tar.gz > /tmp/archive-list.txt
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/deploy.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add multi-provider stock decision dashboard [skip ci]"
          git push origin HEAD:chatgpt-deploy
