name: Apply V6 production patch

on:
  push:
    paths:
      - 'scripts/apply-v6-production-patch.mjs'
      - '.github/workflows/apply-v6-production-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-v6-production-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DayTradingAppV5.tsx
          git diff --cached --quiet || git commit -m "feat: activate V6 event reversal and unified ranker"
          git push
