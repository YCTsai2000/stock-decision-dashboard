name: V6 breakdown-age sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze-v6-breakdown-age.ts'
      - '.github/workflows/analyze-v6-breakdown-age.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Analyze breakdown age
        run: npx --yes tsx scripts/analyze-v6-breakdown-age.ts
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-breakdown-age-sensitivity
          path: backtest-output-v6-breakdown-age/
          retention-days: 30
