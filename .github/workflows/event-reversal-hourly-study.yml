name: Event reversal hourly study

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/event-reversal-hourly-study.mjs'
      - '.github/workflows/event-reversal-hourly-study.yml'

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run two-year hourly structural event study
        run: node scripts/event-reversal-hourly-study.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-reversal-hourly-study
          path: backtest-output-event-hourly/
          if-no-files-found: warn
          retention-days: 30
