name: Event reversal optimizer V3

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/optimize-event-reversal-v3.mjs'
      - '.github/workflows/optimize-event-reversal-v3.yml'

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V3 six-month proxy optimizer
        run: node scripts/optimize-event-reversal-v3.mjs
      - name: Upload V3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-reversal-optimizer-v3
          path: backtest-output-event-reversal-v3/
          if-no-files-found: warn
          retention-days: 30
