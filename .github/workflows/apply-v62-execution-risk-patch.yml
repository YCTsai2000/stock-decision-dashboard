name: Apply V6.2 execution risk patch

on:
  push:
    paths:
      - 'scripts/apply-v62-execution-risk-patch.mjs'
      - '.github/workflows/apply-v62-execution-risk-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-v62-execution-risk-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DayTradingAppV5.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: apply V6.2 execution risk damping"
            git push
          fi
